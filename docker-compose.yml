services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: chainlens
      CLICKHOUSE_USER: chainlens
      CLICKHOUSE_PASSWORD: chainlens
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user chainlens --password chainlens --query 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  clickhouse_data:

